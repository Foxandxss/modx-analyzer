[workspace]
resolver = "2"
members = ["crates/modx-midi", "crates/modx-audio", "src-tauri"]

# `modx-dsp` is deliberately NOT a member: ADR-0001 puts every analysis function
# in TypeScript, so it lives at `packages/modx-dsp` and its golden-WAV tests run
# under Vitest.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
