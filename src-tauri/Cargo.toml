[package]
name = "modx-analyzer-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MODX Analyzer: the desktop app that draws what the MODX is doing"

[lib]
# Distinct from the bin target: `modx-analyzer-app` normalises to the same file
# name and Cargo warns about the collision.
name = "modx_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
modx-audio = { path = "../crates/modx-audio" }
modx-midi = { path = "../crates/modx-midi" }
# Only for the local date and time a volcado is named with. It is already in the
# tree under `tauri-plugin-log`, so it costs nothing new to build.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
