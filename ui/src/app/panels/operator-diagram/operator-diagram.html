<div class="zone">
  <div class="zone__head">
    <h2 class="zone__title">DIAGRAMA DE OPERADORES</h2>
    <!-- La cadencia se rotula por zona, no por cifra, y es la medida del anillo:
         12 Hz en silencio, 2,4 sonando. Tocar cuesta velocidad de sondeo. -->
    <span class="zone__cadence">LOS OCHO · <app-figure [value]="cadence()" [unit]="' Hz'" /></span>
  </div>

  <div class="nodes">
    @for (node of nodes(); track node.operator) {
      <div
        class="node"
        [class.node--carrier]="node.role === 'carrier'"
        [class.node--modulator]="node.role === 'modulator'"
        [class.node--inert]="node.role === 'inert'"
        [class.node--stale]="node.stamp === 'stale'"
        [attr.data-operator]="node.operator"
        [attr.data-role]="node.role"
        [attr.data-stamp]="node.stamp"
      >
        <!-- El Level ES la altura del relleno; la cifra sólo lo confirma. -->
        <div class="node__fill" [style.height.%]="node.fill" aria-hidden="true"></div>

        <div class="node__body">
          <div class="node__head">
            <span class="node__id">OP{{ node.operator }}</span>
            <span class="node__role"><app-figure [value]="node.roleLabel" /></span>
          </div>

          <div class="node__level"><app-figure [value]="node.level" /></div>

          <div class="node__line">
            <app-figure [value]="node.ratio" /> ·
            <app-figure [value]="node.spectralForm" />
          </div>

          <!-- La frecuencia real de la nota viva. Es TEORÍA y lo dice: el
               fundamental que mide el MODX no cae donde dice la fórmula. -->
          <div class="node__hz">
            <app-figure [value]="node.hz" [unit]="' Hz'" />
            <span class="node__hz-stamp">{{ labels.theory }}</span>
          </div>
        </div>

        <span class="node__stamp">{{ labels[node.stamp] }}</span>
      </div>
    }
  </div>

  <div class="legend">
    <span class="legend__item">
      <span class="legend__swatch legend__swatch--carrier" aria-hidden="true"></span>PORTADORA
    </span>
    <span class="legend__item">
      <span class="legend__swatch legend__swatch--modulator" aria-hidden="true"></span>MODULADOR
    </span>
    <span class="legend__item">
      <span class="legend__swatch legend__swatch--inert" aria-hidden="true"></span>LEVEL 0
    </span>
  </div>
</div>
