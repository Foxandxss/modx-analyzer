<header class="bar">
  <div class="port">
    <span class="dot" [class.dot--on]="connected()" aria-hidden="true"></span>
    <span class="port__name">{{ portName() ?? 'MODX-1' }}</span>
  </div>

  <div class="gap" aria-hidden="true"></div>

  <!-- El ancla: el nombre de la Part 1, sondeado a 1 Hz. Sin toque: la pantalla de
       chequeo no existe aún. Tres estados: reposo, acaba de cambiar (el destello
       de 2 200 ms) y releído, que no vuelve al reposo — se queda pidiendo medida.

       El nombre viejo tachado al lado ya no se dibuja: con los 20 caracteres que
       admite el MODX se metía debajo del chip `ALG` y de `FB`, y lo que hay que
       leer en esos 2 200 ms es el nombre nuevo (#19). El destello sigue diciendo
       que acaba de cambiar; lo que se va es qué era antes.

       Y encima ya no hay cejilla: `ANCLA · 1 Hz · 31 00 00` era una cadencia de
       sondeo y una dirección SysEx en los 200 px más caros de la pantalla. En
       reposo el ancla es el nombre y nada más; la procedencia es de la pantalla
       de chequeo (#52), y hasta que exista no se dibuja en ningún sitio. -->
  <div class="anchor" [class.anchor--changed]="justChanged()">
    <span class="anchor__name">
      <app-figure [value]="patch().performanceName" />
    </span>
    @if (unmeasured()) {
      <span class="anchor__unmeasured">NOT MEASURED IN THIS SOUND</span>
    }
  </div>

  <div class="pill pill--algorithm">
    <span class="pill__eyebrow">ALG</span>
    <app-figure [value]="algorithm()" [pad]="2" />
  </div>

  <div class="feedback">
    FB <app-figure [value]="feedback()" /> · OP
    <app-figure [value]="feedbackOperator()" />
  </div>

  <!-- Un modo sin construir no es un botón inhabilitado (DESIGN.md §3.1): la regla
       de que un control inhabilitado se lee entero es para el control que
       funcionará cuando se cumpla su condición, y un modo sin código detrás no
       tiene condición. Así que aquí no hay conmutador — hay la etiqueta del único
       modo que existe y, debajo, la línea de hoja de ruta, que no promete fecha.
       Cuando llegue A/B esto vuelve a ser un conmutador, de dos, y no antes. -->
  <div class="mode">
    <span class="mode__name">{{ mode }}</span>
    <span class="mode__line">the only mode built</span>
  </div>

  <div class="spacer"></div>

  <!-- Transporte. Mirar late y medir es un obturador: dos actos distintos, y aquí
       los dos son ranuras — laten y disparan cuando llegue el audio.

       La pastilla dice dos cosas y ninguna es de la misma clase: arriba, la
       cadencia medida del puente; debajo, qué stream se está mirando —nombre,
       frecuencia de muestreo y canales, los tres leídos del dispositivo que la
       app abrió de verdad, ninguno escrito a mano. Sin dispositivo la segunda
       línea es la raya, no un texto de relleno: lo que falta se dibuja como lo
       que falta. -->
  <div class="look" [class.look--on]="looking()">
    <span class="look__dot" aria-hidden="true"></span>
    <span class="look__lines">
      <span class="look__text">LIVE · {{ fps() === null ? '—' : fps()!.toFixed(1) }} fps</span>
      <span class="look__audio">
        @if (audioLine(); as line) {
          {{ line }}
        } @else {
          <app-figure [value]="dead" />
        }
      </span>
    </span>
  </div>

  <!-- El mismo componente que se repite al pie de la columna medida: un control,
       dos sitios, y ningún estado en el que uno mienta sobre el otro. -->
  <app-capture-button place="header" />

  <!-- Aislamiento en vez de confirmación: filete de 2 px y 16 px de aire, y nada
       accionable dentro de esa franja. -->
  <div class="isolate" aria-hidden="true"></div>

  <!-- Sin confirmación y sin :hover: actúa al levantar el dedo dentro del objetivo. -->
  <button
    type="button"
    class="panic"
    [class.panic--live]="panicLive()"
    [class.panic--done]="panicDone()"
    aria-label="Hush: silence the keyboard"
    (pointerdown)="onPanicDown($event)"
    (pointerup)="onPanicUp($event)"
    (pointercancel)="onPanicCancel()"
    (click)="onPanicClick($event)"
  >
    @if (panicDone()) {
      <span class="panic__label panic__label--done">HUSHED</span>
    } @else {
      <span class="panic__mark" aria-hidden="true"></span>
      <span class="panic__label">HUSH</span>
    }
  </button>
</header>
